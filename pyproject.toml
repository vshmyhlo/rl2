[project]
name = "rl2"
version = "0.1.0"
description = "Reinforcement learning with JAX and Flax"
readme = "README.md"
authors = [
    { name = "vshmyhlo", email = "vlad@cohere.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ale-py>=0.11,<0.12",
    "chex>=0.1.90,<0.2",
    "craftax==1.6.1",
    "distrax>=0.1.9,<0.2",
    "flax>=0.12.10,<0.13",
    "gcsfs",
    "gemma==4.0.1",
    "google-cloud-storage>=3.15.1",
    "gymnasium>=1.1,<2",
    "gymnax>=0.0.9,<0.1",
    "jax>=0.11.2,<0.12",
    "jax[cuda12]>=0.11.2,<0.12; sys_platform == 'linux'",
    "jax-triton>=0.4.1,<0.5; sys_platform == 'linux'",
    "jaxmarl==0.2.0",
    "kauldron>=1.4.4,<2",
    "kinetix-env==3.0.2",
    "mctx>=0.0.6,<0.1",
    "metaljax>=0.11.8,<0.12; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlflow-skinny[db]>=3.17.1,<4",
    "moviepy>=2.2,<3",
    "numpy>=2,<3",
    "omegaconf>=2.4,<3",
    "opencv-python-headless>=4.10,<5",
    "optax>=0.2.4,<0.3",
    "orbax-checkpoint>=0.12.6,<0.13",
    "pgx>=2.6,<3",
    "pydantic>=2.13,<3",
    "pytest>=9.1.1",
    "pyyaml>=6,<7",
    "reasoning-gym>=0.1.25",
    "rlax>=0.1.8,<0.2",
    "ruff>=0.16.9",
    "sentencepiece>=0.2,<0.3",
    "tensorboard>=2.18,<3",
    "tensorboardx>=2.6.5,<3",
    "tfp-nightly>=0.26.0.dev0,<0.27",
    "tokamax>=0.0.15; sys_platform == 'linux'",
    "xminigrid==0.9.3",
]

[project.scripts]
mappo = "rl2.train_mappo:main"
ppo = "rl2.ppo:main"
ppo_rnd = "rl2.ppo_rnd:main"
rl2-reasoning = "rl2.reasoning_cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.uv]
# Kauldron also requests desktop OpenCV; both variants install the same cv2 files.
# Use the explicit headless dependency above for server-side Atari preprocessing.
exclude-dependencies = ["opencv-python"]

# Relax Kinetix's JAX/MoviePy constraints and use Jax2D's current jnp.clip API.
# Its environment API is tested against rl2's versions; its training scripts are unused.
[[tool.uv.dependency-metadata]]
name = "kinetix-env"
version = "3.0.2"
requires-dist = [
    "jax>=0.4.37",
    "distrax",
    "optax",
    "flax>=0.10.4",
    "numpy",
    "argparse",
    "wandb",
    "orbax-checkpoint",
    "pygame",
    "gymnax",
    "chex",
    "matplotlib",
    "imageio",
    "seaborn",
    "hydra-core",
    "safetensors",
    "pygame_widgets==1.1.5",
    "jaxgl",
    "jax2d==1.0.2",
    "moviepy>=1.0.3",
    "zarr==2.18.3",
    "numcodecs==0.13.1",
    "grain",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

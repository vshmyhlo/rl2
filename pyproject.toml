[project]
name = "rl2"
version = "0.1.0"
description = "Reinforcement learning with JAX and Flax"
readme = "README.md"
authors = [
    { name = "vshmyhlo", email = "vlad@cohere.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "ale-py>=0.11,<0.12",
    "alfworld>=0.4.2,<0.5",
    "brax==0.14.2",
    "chex>=0.1.90,<0.2",
    "craftax==1.6.1",
    # Match the CUDA 13.0 runtime used by torch/vLLM, including JIT compilation.
    "cuda-toolkit[cccl,nvcc]==13.0.3.0; sys_platform == 'linux'",
    "cuda-python>=13.0.3,<13.1; sys_platform == 'linux'",
    "distrax>=0.1.9,<0.2",
    "flax>=0.12.10,<0.13",
    "gcsfs",
    "gemma==4.0.1",
    "google-cloud-storage>=3.15.1",
    "gymnasium>=1.1,<2",
    "gymnax>=0.0.9,<0.1",
    "huggingface-hub>=1,<2",
    "httpx>=0.27,<1",
    "jax>=0.11.2,<0.12",
    "jax[cuda13]>=0.11.2,<0.12; sys_platform == 'linux'",
    "jax-triton>=0.4.1,<0.5; sys_platform == 'linux'",
    "jaxmarl==0.2.0",
    "jaxtari==0.2.0",
    "kauldron>=1.4.4,<2",
    "kinetix-env==3.0.2",
    "mctx>=0.0.6,<0.1",
    "metaljax>=0.11.8,<0.12; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlflow-skinny[db]>=3.17.1,<4",
    "moviepy>=2.2,<3",
    "numpy>=2,<3",
    "omegaconf>=2.4,<3",
    "opencv-python-headless>=4.10,<5",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "optax>=0.2.4,<0.3",
    "orbax-checkpoint>=0.12.6,<0.13",
    "pgx>=2.6,<3",
    "playground==0.2.0",
    "pydantic>=2.13,<3",
    "pyopengl>=3.1.10,<4",
    "pytest>=9.1.1",
    "pyyaml>=6,<7",
    "ray[default]>=2.50,<3; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "reasoning-gym>=0.1.25",
    "rlax>=0.1.8,<0.2",
    "ruff>=0.16.9",
    "safetensors>=0.8,<0.9",
    "sentencepiece>=0.2,<0.3",
    "soundfile>=0.13,<0.14; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "tfp-nightly>=0.26.0.dev0,<0.27",
    "tokamax>=0.0.15; sys_platform == 'linux'",
    "tokenizers>=0.22,<0.24",
    # Keep this pair together: vLLM wheels are built against a specific PyTorch.
    "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "vllm==0.27.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "transformers>=5.5.3,<5.6; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "xminigrid==0.9.3",
    "verifiers>=0.4.0,<0.5",
    "datasets>=4",
    "jaxrobotarium",
    "robotarium-python-simulator",
    "jaxopt>=0.8.5,<0.9",
    "continual-foragax==0.57.1",
]

[project.optional-dependencies]
bfcl = [
    "bfcl-eval==2025.12.17; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]

[project.scripts]
mappo = "rl2.train_mappo:main"
ppo = "rl2.ppo:main"
ppo_rnd = "rl2.ppo_rnd:main"
rl2-reasoning = "rl2.reasoning_cli:main"
rl2-bfcl = "rl2.bfcl.runner:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.uv]
# Kauldron also requests desktop OpenCV; both variants install the same cv2 files.
# Use the explicit headless dependency above for server-side Atari preprocessing.
exclude-dependencies = ["opencv-python"]
# The toolkit leaves the JIT linker's minor version open.
constraint-dependencies = ["nvidia-nvjitlink<13.1"]

# Verifiers' renderers need Pillow 12; retain MoviePy's other bounds.
[[tool.uv.dependency-metadata]]
name = "moviepy"
version = "2.2.1"
requires-dist = [
    "decorator>=4.0.2,<6.0",
    "imageio>=2.5,<3.0",
    "imageio-ffmpeg>=0.2.0",
    "numpy>=1.25.0",
    "proglog<=1.0.0",
    "python-dotenv>=0.10",
    "pillow>=9.2.0,<13",
]

# Relax Kinetix's JAX/MoviePy constraints and use Jax2D's current jnp.clip API.
# Its environment API is tested against rl2's versions; its training scripts are unused.
[[tool.uv.dependency-metadata]]
name = "kinetix-env"
version = "3.0.2"
requires-dist = [
    "jax>=0.4.37",
    "distrax",
    "optax",
    "flax>=0.10.4",
    "numpy",
    "argparse",
    "wandb",
    "orbax-checkpoint",
    "pygame",
    "gymnax",
    "chex",
    "matplotlib",
    "imageio",
    "seaborn",
    "hydra-core",
    "safetensors",
    "pygame_widgets==1.1.5",
    "jaxgl",
    "jax2d==1.0.2",
    "moviepy>=1.0.3",
    "zarr==2.18.3",
    "numcodecs==0.13.1",
    "grain",
]

[tool.uv.sources]
jaxrobotarium = { url = "https://github.com/GT-STAR-Lab/JaxRobotarium/archive/6200711f6fb98015579af3e7a534bcfb8bcb69af.tar.gz" }
robotarium-python-simulator = { url = "https://github.com/shalin-jain/robotarium_python_simulator/archive/117043719147e8ab04a6332ae4abe9ce8511a762.tar.gz" }

[tool.pytest.ini_options]
testpaths = ["tests"]

# Relax only BFCL's NumPy pin; retain other packages' compatibility bounds.
[[tool.uv.dependency-metadata]]
name = "bfcl-eval"
version = "2025.12.17"
requires-dist = [
    "requests",
    "tqdm",
    "numpy>=2,<3",
    "pandas",
    "pathlib",
    "huggingface_hub",
    "pydantic>=2.8.2",
    "python-dotenv>=1.0.1",
    "tree_sitter==0.21.3",
    "tree-sitter-java==0.21.0",
    "tree-sitter-javascript==0.21.4",
    "openai>=1.86.0",
    "mistralai==1.7.0",
    "anthropic>=0.75.0",
    "cohere==5.18.0",
    "typer>=0.12.5",
    "tabulate>=0.9.0",
    "datamodel-code-generator==0.25.7",
    "google-genai>=1.52.0",
    "qwen-agent",
    "mpmath==1.3.0",
    "tenacity>=8.5.0",
    "writer-sdk>=2.1.0",
    "overrides",
    "boto3",
    "beautifulsoup4",
    "html2text",
    "rank_bm25==0.2.2",
    "google-search-results",
    "sentence-transformers>=2.7.0",
    "faiss-cpu==1.11.0",
    "networkx==3.3",
    "filelock==3.20.0",
    "vllm==0.8.5; extra == \"oss-eval-vllm\"",
    "sglang[all]; extra == \"oss-eval-sglang\"",
    "wandb==0.18.5; extra == \"wandb\"",
]

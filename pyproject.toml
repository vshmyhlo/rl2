[project]
name = "rl2"
version = "0.1.0"
description = "Barebones PPO for Atari in JAX and Flax"
readme = "README.md"
authors = [
    { name = "vshmyhlo", email = "vlad@cohere.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ale-py>=0.11,<0.12",
    "chex>=0.1.90,<0.2",
    "flax>=0.12.10,<0.13",
    "gcsfs",
    "google-cloud-storage>=3.15.1",
    "gymnasium>=1.1,<2",
    "jax>=0.11.2,<0.12",
    "moviepy>=2.2,<3",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "optax>=0.2.4,<0.3",
    "pyyaml>=6,<7",
    "reasoning-gym>=0.1.25",
    "ruff>=0.16.9",
    "tensorboard>=2.18,<3",
    "tensorboardx>=2.6.5,<3",
]

[project.optional-dependencies]
gemma3 = [
    "gemma==4.0.1",
    "kauldron>=1.4.4,<2",
]
gdn2 = [
    "sentencepiece>=0.2,<0.3",
]
gdn2-triton = [
    "jax-triton>=0.4.1,<0.5; sys_platform == 'linux'",
]
cuda12 = [
    "jax[cuda12]>=0.11.2,<0.12; sys_platform == 'linux'",
    "tokamax>=0.0.15; sys_platform == 'linux'",
]
metal = [
    "metaljax>=0.11.8,<0.12; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
ppo = "rl2.ppo:main"
ppo_rnd = "rl2.ppo_rnd:main"
rl2-reasoning = "rl2.reasoning_cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

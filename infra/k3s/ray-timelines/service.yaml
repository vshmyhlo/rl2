apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-timelines
  namespace: training
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ray-timelines
  template:
    metadata:
      labels:
        app: ray-timelines
    spec:
      serviceAccountName: ray-timelines
      containers:
        - name: viewer
          image: python:3.12-slim-bookworm
          command: [python, /viewer/server.py, --host, "0.0.0.0"]
          ports:
            - name: http
              containerPort: 8085
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: viewer
              mountPath: /viewer
              readOnly: true
            - name: runs
              mountPath: /runs
              readOnly: true
      volumes:
        - name: viewer
          configMap:
            name: ray-timeline-viewer
        - name: runs
          persistentVolumeClaim:
            claimName: training-runs
---
apiVersion: v1
kind: Service
metadata:
  name: ray-timelines
  namespace: training
spec:
  type: ClusterIP
  selector:
    app: ray-timelines
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray-timelines
  namespace: training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ray-timelines
  namespace: training
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ray-timelines
  namespace: training
subjects:
  - kind: ServiceAccount
    name: ray-timelines
    namespace: training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ray-timelines

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training jobs</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid #ddd; }
  #status { flex: 1; }
  button { padding: 6px 12px; cursor: pointer; }
  form { margin: 48px auto; padding: 0 16px; width: min(480px, calc(100% - 32px)); }
  label { display: block; margin-bottom: 8px; }
  input { box-sizing: border-box; width: 100%; padding: 10px; margin-bottom: 12px; font: inherit; }
  iframe { flex: 1; width: 100%; border: 0; }
  a { color: #165cbd; }
  main { padding: 24px 16px; overflow: auto; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; vertical-align: top; }
  th { background: #f5f6f8; }
  td a { display: inline-block; margin-right: 16px; }
  #empty { padding: 20px 0; }
</style>
<header>
  <a href="/">All jobs</a>
  <strong id="title">Ray timeline</strong>
  <a id="metrics" target="_blank" rel="noopener" hidden>Job metrics ↗</a>
  <a id="tempo" target="_blank" rel="noopener" hidden>Tempo traces ↗</a>
  <span id="status" role="status">Waiting for snapshot…</span>
  <button id="refresh" type="button">Load latest</button>
</header>
<main id="jobs" hidden>
  <h1>Training jobs</h1>
  <p>Running and queued jobs · refreshes every 10 seconds. Ray dashboards are available while Ray is running.</p>
  <table>
    <thead><tr><th>Job / run</th><th>Status</th><th>Created</th><th>Open</th></tr></thead>
    <tbody id="job-rows"></tbody>
  </table>
  <p id="empty" hidden>No running or queued jobs.</p>
</main>
<form id="job-form" action="/" method="get" novalidate hidden>
  <label for="job-id">Job ID</label>
  <input id="job-id" name="job" placeholder="train-3af36a22fa6b4186" required
    pattern="[A-Za-z0-9_\-]+" title="Use letters, numbers, underscores, or hyphens."
    autocomplete="off" spellcheck="false">
  <button type="submit">Open timeline</button>
</form>
<iframe id="viewer" title="Perfetto trace viewer" hidden></iframe>
<script>
  const origin = "https://ui.perfetto.dev";
  const viewer = document.getElementById("viewer");
  const status = document.getElementById("status");
  const job = new URLSearchParams(location.search).get("job");
  const form = document.getElementById("job-form");
  const input = document.getElementById("job-id");
  form.onsubmit = (event) => {
    input.value = input.value.trim();
    if (!form.reportValidity()) event.preventDefault();
  };
  document.getElementById("refresh").onclick = () => location.reload();

  function tempoUrl(jobName) {
    const panes = {
      tempo: {
        datasource: "tempo",
        queries: [{
          refId: "A",
          datasource: {type: "tempo", uid: "tempo"},
          queryType: "traceql",
          query: `{ resource.service.name = "rl2" && resource.k8s.job.name = ${JSON.stringify(jobName)} }`,
          limit: 20,
          tableType: "traces",
          editorMode: "code",
        }],
        range: {from: "now-1h", to: "now"},
        compact: false,
      },
    };
    const params = new URLSearchParams({schemaVersion: "1", panes: JSON.stringify(panes), orgId: "1"});
    return `http://localhost:8082/explore?${params}`;
  }

  function metricsUrl(jobName, created) {
    const start = Date.parse(created);
    const params = new URLSearchParams({
      "var-namespace": "training",
      "var-job_name": jobName,
      from: Number.isNaN(start) ? "now-7d" : String(start - 60000),
      to: "now",
    });
    return `http://localhost:8082/d/training-job?${params}`;
  }

  async function loadJobs() {
    try {
      const response = await fetch("/api/jobs", {cache: "no-store"});
      if (!response.ok) throw new Error(`Could not list jobs (HTTP ${response.status}). Retrying in 10 seconds.`);
      const jobs = await response.json();
      const rows = document.getElementById("job-rows");
      rows.replaceChildren();
      for (const item of jobs) {
        const row = rows.insertRow();
        row.insertCell().textContent = item.name + (item.run_id ? ` / ${item.run_id}` : "");
        row.insertCell().textContent = item.status;
        row.insertCell().textContent = item.created ? new Date(item.created).toLocaleString() : "—";
        const links = row.insertCell();
        if (item.status === "Running") {
          const dashboard = document.createElement("a");
          dashboard.href = `/dashboard/${encodeURIComponent(item.name)}/`;
          dashboard.textContent = "Ray dashboard ↗";
          dashboard.target = "_blank";
          dashboard.rel = "noopener";
          links.append(dashboard);
        }
        const timeline = document.createElement("a");
        timeline.href = `/?job=${encodeURIComponent(item.name)}`;
        timeline.textContent = "Timeline";
        links.append(timeline);
        const metrics = document.createElement("a");
        metrics.href = metricsUrl(item.name, item.created);
        metrics.textContent = "Job metrics ↗";
        metrics.target = "_blank";
        metrics.rel = "noopener";
        links.append(metrics);
        const tempo = document.createElement("a");
        tempo.href = tempoUrl(item.name);
        tempo.textContent = "Tempo traces ↗";
        tempo.target = "_blank";
        tempo.rel = "noopener";
        links.append(tempo);
      }
      document.getElementById("empty").hidden = jobs.length !== 0;
      status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    } catch (error) {
      status.textContent = error.message;
    } finally {
      setTimeout(loadJobs, 10000);
    }
  }

  function ready() {
    return new Promise((resolve, reject) => {
      const cleanup = () => {
        clearInterval(ping);
        clearTimeout(timeout);
        window.removeEventListener("message", receive);
      };
      const receive = (event) => {
        if (event.origin === origin && event.source === viewer.contentWindow && event.data === "PONG") {
          cleanup();
          resolve();
        }
      };
      const ping = setInterval(() => viewer.contentWindow.postMessage("PING", origin), 200);
      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error("Perfetto did not respond. Check your connection and click Load latest."));
      }, 60000);
      window.addEventListener("message", receive);
    });
  }

  async function load() {
    if (!job || !/^[A-Za-z0-9_-]+$/.test(job)) {
      document.getElementById("title").textContent = "Training jobs";
      document.getElementById("refresh").textContent = "Refresh";
      document.getElementById("jobs").hidden = false;
      form.hidden = false;
      input.value = job || "";
      document.querySelector('label[for="job-id"]').textContent = "Open a saved timeline by job ID";
      await loadJobs();
      return;
    }
    document.getElementById("title").textContent = job;
    document.title = `${job} · Ray timeline`;
    const metrics = document.getElementById("metrics");
    metrics.href = metricsUrl(job);
    metrics.hidden = false;
    const tempo = document.getElementById("tempo");
    tempo.href = tempoUrl(job);
    tempo.hidden = false;
    let response;
    while (true) {
      response = await fetch(`/traces/${encodeURIComponent(job)}.json`, {cache: "no-store"});
      if (response.status !== 404) break;
      status.textContent = "Waiting for the first snapshot. The job may be queued; snapshots save every minute.";
      await new Promise((resolve) => setTimeout(resolve, 5000));
    }
    if (!response.ok) throw new Error(`Could not load snapshot (HTTP ${response.status}). Click Load latest to retry.`);
    const buffer = await response.arrayBuffer();
    status.textContent = "Opening snapshot in Perfetto…";
    const handshake = ready();
    viewer.hidden = false;
    viewer.src = origin;
    await handshake;
    viewer.contentWindow.postMessage({
      perfetto: {buffer, title: job, url: location.href, downloadable: true}
    }, origin, [buffer]);
    const saved = response.headers.get("Last-Modified");
    status.textContent = `Snapshot ${saved ? new Date(saved).toLocaleString() : "loaded"}. Load latest to refresh.`;
  }
  load().catch((error) => { status.textContent = error.message; });
</script>
</html>

apiVersion: v1
kind: Namespace
metadata:
  name: kueue-system
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kueue
  namespace: kube-system
spec:
  chart: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.1/kueue-0.20.1.tgz
  targetNamespace: kueue-system
  valuesContent: |-
    enableKueueViz: true
    kueueViz:
      backend:
        auth:
          mode: Disabled
        env:
          - name: KUEUEVIZ_ALLOWED_ORIGINS
            value: http://localhost:8083,http://127.0.0.1:8083
        ingress:
          enabled: false
          # Also sets the frontend's WebSocket URL when ingress is disabled.
          host: localhost:8084
          tlsEnabled: false
          tlsSecretName: ""
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      frontend:
        ingress:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
    managerConfig:
      controllerManagerConfigYaml: |-
        apiVersion: config.kueue.x-k8s.io/v1beta2
        kind: Configuration
        health:
          healthProbeBindAddress: :8081
        metrics:
          bindAddress: :8443
        webhook:
          port: 9443
        leaderElection:
          leaderElect: true
          resourceName: c1f6bfd2.kueue.x-k8s.io
        manageJobsWithoutQueueName: false
        managedJobsNamespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: training
        integrations:
          frameworks: [batch/job]
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  repo: https://nvidia.github.io/k8s-device-plugin
  chart: nvidia-device-plugin
  version: "0.20.1"
  targetNamespace: kube-system
  valuesContent: |-
    runtimeClassName: nvidia
    migStrategy: none
    failOnInitError: true
    deviceListStrategy: envvar
    affinity:
      nodeAffinity: null
    nodeSelector:
      kubernetes.io/hostname: vlad-dev-gpu-1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-job-deleter
  namespace: training
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-job-deleter
  namespace: training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-job-deleter
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: headlamp

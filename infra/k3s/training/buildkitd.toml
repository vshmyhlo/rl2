root = "/var/lib/rl2-buildkit"

[grpc]
  address = ["unix:///run/rl2-buildkit/buildkitd.sock"]

[worker.oci]
  enabled = false

[worker.containerd]
  enabled = true
  address = "/run/k3s/containerd/containerd.sock"
  namespace = "k8s.io"
  networkMode = "host"
  max-parallelism = 2
  reservedSpace = "10GB"
  maxUsedSpace = "30GB"
  minFreeSpace = "20GB"

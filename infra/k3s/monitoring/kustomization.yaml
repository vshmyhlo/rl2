apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - monitoring.yaml
  - tempo.yaml
configMapGenerator:
  - name: tempo-config
    namespace: monitoring
    files:
      - tempo.yaml=tempo-config.yaml
  - name: gpu-dashboard
    namespace: monitoring
    files:
      - gpu-dashboard.json
    options:
      disableNameSuffixHash: true

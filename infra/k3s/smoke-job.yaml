apiVersion: batch/v1
kind: Job
metadata:
  name: k3s-smoke
  namespace: default
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: busybox:1.37.0
          command: ["sh", "-ec", "nslookup kubernetes.default.svc.cluster.local; echo k3s-smoke-ok"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi

seed: 1
total_updates: 100000
num_tasks: 32
max_unique_tasks: 1 # Set to 1 to overfit one fixed problem across all updates; null samples fresh tasks
group_size: 8 # Independent editing episodes per task, all starting from the fixed turnLeft program
env_workers: 8 # Persistent spawned workers for batched reset/stepping; 0 runs locally
num_minibatches: 4 # Must divide num_tasks * group_size; episodes stay together
update_epochs: 1
max_seq_len: 512 # Total prefill tokens, policy EDIT tokens, and FEEDBACK reports
allow_stop: false # Set false to keep editing until no complete edit fits the remaining sequence budget
max_nodes: 128 # Whole candidate tree, including lists and values
max_depth: 32 # AST edges, including lists
bf16: true
attention_implementation: cudnn # Use xla for CPU
d_model: 512
num_layers: 8
num_heads: 8
num_kv_heads: null
learning_rate: 0.0001
anneal_lr: true
clip_coef: 0.2 # Per decoder decision, including location selection and STOP
target_kl: 0.02
entropy_coef: 0.01
max_grad_norm: 1.0
log_dir: gs://cohere-dev/vlad/rl2/karel_ast_ar_edit # Local or gs:// path
run_id: delta_conv_all_steps_v5 # Every-token image encoder; use a fresh run, incompatible with older encoders
checkpoint_interval_seconds: 300
log_interval: 10
log_program_interval: 10
log_program_count: 4
log_compiles: true
# Causal Transformer with KV caching: EDIT(turnLeft program) -> FEEDBACK -> EDIT actions -> FEEDBACK -> ...
# Execute the fixed turnLeft program first; each policy edit selects a location, then fills its holes.
# Complete programs execute immediately; the following FEEDBACK token introduces their output.
# Every token, including prefill, receives initial/target/current grids through 1x1 Conv + GELU and projection.
# Current image starts at the initial turnLeft execution result and changes after completed edits.
# max_seq_len is both the episode token budget and KV-cache capacity.
# Replay uses full causal histories; the initial FEEDBACK predicts the first sampled edit location.
# Replacement size varies; masks reserve nodes/source tokens AND sequence tokens to complete every hole; each feedback report consumes one token.
# Execute only complete candidates, always from the original input grid.
# Feedback: last final/partial grid, score, success/error, ticks, size, score delta, sequence tokens left.
# Edit rewards are score differences from the preceding execution; GRPO normalizes summed episode returns within each task group.
# Every decision, including STOP, shares the episode advantage. No critic or extra terminal reward.
# Regressive edits are accepted; success does not force early stopping.
env:
  height: 8
  width: 8
  wall_probability: 0.1
  marker_probability: 0.2
  max_markers: 10
  max_depth: 2
  max_statements: 3
  max_program_tokens: 128
  max_execution_steps: 256
  max_sampling_attempts: 10000
  task_easy_weight: 0.20
  task_navigation_weight: 0.30
  task_marker_weight: 0.25
  task_combined_weight: 0.25
  navigation_min_distance: 3
  marker_min_edits: 3
  combined_min_distance: 2
  combined_min_edits: 2
  syntax_weight: 0.0
  runtime_weight: 0.0
  distance_weight: 1.0
  success_weight: 1.0
  position_weight: 1.0
  orientation_weight: 1.0
  marker_weight: 1.0
  trajectory_weight: 0.0
  length_penalty_weight: 0.1 # AST node count / max_nodes (including lists and values)
  depth_penalty_weight: 0.1 # AST depth / top-level max_depth (candidate AST limit)
  execution_penalty_weight: 0.1 # Consumed execution ticks / max_execution_steps

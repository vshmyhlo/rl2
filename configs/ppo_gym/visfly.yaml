env:
  id: VisFly
  entry_point: rl2.envs.visfly.navigation:RGBNavigationEnv
  num_scenes: 8 # 4 agents per scene
  scene_rotation_env_steps: 128000 # Reload after 4000 steps per agent (80 seconds); truncate ongoing episodes
  power: # Uncalibrated effort shaping; null disables, zero weights retain diagnostics only.
    energy_weight: 0.1 # Reward cost per hover-equivalent second; hover costs 0.001 per 50 Hz action.
    excess_power_weight: 0.1 # Cost per second times squared excess power ratio.
    power_threshold: 1.5 # Excess penalty starts above 1.5 times hover power.
  route_sampling:
    weights: [0.2, 0.4, 0.4] # Easy clear, long clear, obstacle-crossing; renormalize over available levels
    spacing: 0.75 # Metres; uniform PRM sample density, cached per loaded scene
    jitter: 0.2 # Metres; validated endpoint perturbations at each reset
  evaluation:
    manifest_path: /runs/visfly/eval_manifest.json # Shared job volume; generate offline before training
    reference_speed: 1.0 # m/s for route-length-based time budgets
    maneuver_seconds: 10.0
  kwargs:
    device: cpu # VisFly tensors/dynamics; Habitat still renders on GPU alongside JAX
    visual: true
    planning_workers: 4 # Independent CPU processes; fresh catalogues per scene visit
    planning_prefetch: true # Prepare the next rotation while the current scenes train
    shared_rgbd: true # One draw for aligned RGB/depth; separate passes for incompatible sensors or video
    max_episode_steps: 1500 # 30 seconds at 50 Hz; evaluation uses each saved route budget
    failure_penalty: 1.0 # Subtract once on terminal failure; 0 disables. Success and truncation alone are exempt.
    scene_randomization: true
    spawn_clearance: 0.3 # Metres from geometry
    flight_height: [0.5, 2.5] # Metres above each scene's bounding-box floor
    goal_distance: [2.0, 8.0] # Legacy sampling only, when route_sampling is disabled
    scene_kwargs:
      path: ${oc.env:VISFLY_SCENE_PATH} # Trainer reserves test/* and *_test/* scenes for evaluation
      scene_type: json
      shuffle: true
      render_settings:
        sensor_type: color
        mode: follow
        view: near
        resolution: [256, 256]
    dynamics_kwargs:
      action_type: bodyrate
      dt: 0.0025 # 400 Hz physics
      ctrl_dt: 0.02 # 50 Hz control; 8 physics steps per action
    random_kwargs:
      state_generator:
        class: Uniform
        kwargs:
          - orientation: # Roll/pitch/yaw in radians; positions use scene bounds
              mean: [0.0, 0.0, 0.0]
              half: [0.1, 0.1, 3.141592653589793]
            velocity: # Metres per second
              mean: [0.0, 0.0, 0.0]
              half: [0.5, 0.5, 0.2]
            angular_velocity: # Radians per second
              mean: [0.0, 0.0, 0.0]
              half: [0.1, 0.1, 0.2]
    sensor_kwargs:
      - sensor_type: COLOR
        uuid: color
        resolution: [64, 64]
      - sensor_type: DEPTH
        uuid: depth
        resolution: [64, 64]
seed: 12
total_steps: 10000000
num_envs: 32
num_steps: 100 # 2 simulated seconds per agent at 50 Hz
num_minibatches: 2
update_epochs: 2
model:
  encoder:
    type: visfly # RGB-D CNN with body-frame navigation features
    stages:
      - { channels: 16, blocks: 1 } # 32x32
      - { channels: 32, blocks: 1 } # 16x16
      - { channels: 64, blocks: 1 } # 8x8
    embedding_size: 128
    goal_scale: 10.0 # Metres
    velocity_scale: 5.0 # Metres/second
    angular_velocity_scale: 10.0 # Radians/second
    depth_scale: 20.0 # Metres; divide depth by this scale and clip to [0, 1]
  recurrent:
    hidden_size: 128
  continuous_policy: truncated_gaussian
bf16: false
learning_rate: 0.0003
anneal_lr: true
gamma: 0.995
gae_lambda: 0.95
clip_coef: 0.2
target_kl: 0.02
entropy_coef: 0.001
max_grad_norm: 0.5
video_fps: 50.0
video_interval: 200 # Record videos only during evaluation
eval_interval: 500
eval_episodes: null # Required with env.evaluation; use a positive count only when env.evaluation is null
eval_video: true
run_id: ppo_gym_visfly_rgbd_ne${num_envs}_ns${num_steps}_mb${num_minibatches}_ue${update_epochs}_fp${env.kwargs.failure_penalty}_ew${env.power.energy_weight}_seed${seed}
ckpt_dir: /runs/ppo_gym/${run_id}

env:
  id: VisFly
  entry_point: rl2.envs.visfly.navigation:RGBNavigationEnv
  num_scenes: 8 # 4 agents per scene
  scene_rotation_env_steps: 32000 # Reload after 1000 steps per agent (20 simulated seconds at 50 Hz); truncate ongoing episodes
  kwargs:
    device: cpu # VisFly tensors/dynamics; Habitat still renders on GPU alongside JAX
    visual: true
    max_episode_steps: 500 # 10 seconds at 50 Hz
    failure_penalty: 20.0 # Subtract once on terminal failure; 0 disables. Success and truncation alone are exempt.
    scene_randomization: true
    spawn_clearance: 0.3 # Metres from geometry
    flight_height: [0.5, 2.5] # Metres above each scene's bounding-box floor
    goal_distance: [2.0, 8.0] # Metres from the sampled start
    scene_kwargs:
      path: ${oc.env:VISFLY_SCENE_PATH} # Trainer reserves test/* and *_test/* scenes for evaluation
      scene_type: json
      shuffle: true
      render_settings:
        sensor_type: color
        mode: follow
        view: near
        resolution: [256, 256]
    dynamics_kwargs:
      action_type: bodyrate
      dt: 0.0025 # 400 Hz physics
      ctrl_dt: 0.02 # 50 Hz control; 8 physics steps per action
    random_kwargs:
      state_generator:
        class: Uniform
        kwargs:
          - orientation: # Roll/pitch/yaw in radians; positions use scene bounds
              mean: [0.0, 0.0, 0.0]
              half: [0.1, 0.1, 3.141592653589793]
            velocity: # Metres per second
              mean: [0.0, 0.0, 0.0]
              half: [0.5, 0.5, 0.2]
            angular_velocity: # Radians per second
              mean: [0.0, 0.0, 0.0]
              half: [0.1, 0.1, 0.2]
    sensor_kwargs:
      - sensor_type: COLOR
        uuid: color
        resolution: [64, 64]
seed: 6
total_steps: 10000000
num_envs: 32
num_steps: 100 # 2 simulated seconds per agent at 50 Hz
num_minibatches: 2
update_epochs: 2
model:
  encoder:
    type: visfly # RGB CNN with body-frame navigation features
    stages:
      - { channels: 16, blocks: 1 } # 32x32
      - { channels: 32, blocks: 1 } # 16x16
      - { channels: 64, blocks: 1 } # 8x8
    embedding_size: 128
    goal_scale: 10.0 # Metres
    velocity_scale: 5.0 # Metres/second
    angular_velocity_scale: 10.0 # Radians/second
  recurrent:
    hidden_size: 128
  continuous_policy: truncated_gaussian
bf16: false
learning_rate: 0.0003
anneal_lr: true
gamma: 0.995
gae_lambda: 0.95
clip_coef: 0.2
target_kl: 0.02
entropy_coef: 0.001
max_grad_norm: 0.5
video_fps: 50.0
video_interval: 0 # Record videos only during evaluation
eval_interval: 100
eval_episodes: 10
eval_video: true
run_id: ppo_gym_visfly_ne${num_envs}_ns${num_steps}_mb${num_minibatches}_ue${update_epochs}_fp${env.kwargs.failure_penalty}_seed${seed}
ckpt_dir: /runs/ppo_gym/${run_id}

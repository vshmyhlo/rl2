# Two team agents; each policy call selects commands for all 16 ships.
# Run: uv run mappo --config configs/mappo/lux.yaml
env:
  id: luxai_s3
  map_size: 16
  max_units: 16
  max_steps_in_match: 100
  match_count: 5
  randomize_params: true
seed: 7
total_env_steps: 100_000_000
# Two GPUs: 16 environments each.
num_envs: 16
# Recurrent carry persists across rollout boundaries.
num_steps: 512
# Limit activation memory.
num_minibatches: 4
update_epochs: 1
model:
  type: lux
  attention_implementation: triton
bf16: false
learning_rate: 0.0003
anneal_lr: true
lr_decay: linear
gamma: 0.997
gae_lambda: 0.99
clip_coef: 0.2
target_kl: 0.03
# Entropy is summed across all ship commands in the team action.
entropy_coef: 0.001
entropy_decay: constant
value_coef: 1.0
max_grad_norm: 0.5
ckpt_dir: /runs/mappo/${run_id}
run_id: mappo_lux_${env.map_size}x${env.map_size}_mb${num_minibatches}_ep${update_epochs}_s${seed}
# Intervals count training iterations.
log_interval: 10
video_interval: 0
video_fps: 10
checkpoint_interval: 200
# Full Orbax checkpoint directories; each contains state/ and metadata/.
eval_interval: 400
eval_episodes: 100
eval_seed: 10000
eval_ref_policies:
  selfplay_s7: /runs/mappo/mappo_lux_selfplay_16x16_mb4_ep1_s7/checkpoints/5400


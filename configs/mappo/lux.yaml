# Two team agents; each policy call selects commands for all 16 ships.
# Run: uv run mappo --config configs/mappo/lux.yaml
env:
  id: luxai_s3
  map_size: 32
  max_units: 16
  max_steps_in_match: 100
  match_count: 5
  randomize_params: true
# Thresholds count completed training iterations.
# map_size_curriculum:
#   - { start_iteration: 0, map_size: 8 }
#   - { start_iteration: 500, map_size: 16 }
#   - { start_iteration: 1000, map_size: 24 }
#   - { start_iteration: 1500, map_size: 32 }
seed: 8
total_iterations: 10_000
# Two GPUs: four environments each.
num_envs: 8
# Recurrent carry persists across rollout boundaries.
num_steps: 512
# Limit activation memory.
num_minibatches: 4
update_epochs: 1
model:
  type: lux
  attention_implementation: xla
dtype: float32
learning_rate: 0.0003
anneal_lr: true
lr_decay: linear
gamma: 0.997
gae_lambda: 0.99
clip_coef: 0.2
target_kl: 0.03
# Entropy is summed across all ship commands in the team action.
entropy_coef: 0.001
entropy_decay: constant
value_coef: 1.0
max_grad_norm: 0.5
ckpt_dir: /runs/mappo/${run_id}
run_id: mappo_lux_${env.map_size}x${env.map_size}_mb${num_minibatches}_ep${update_epochs}_s${seed}
# Intervals count training iterations.
log_interval: 10
video_interval: 200
video_fps: 10
checkpoint_interval: 200
# Full Orbax checkpoint directories; each contains state/ and metadata/.
eval_interval: 1000
eval_episodes: 100


# Eight robots sharing a compact, lightly obstructed map: emphasize avoiding one another.
env_id: JaxNav
jaxnav:
  num_agents: 8
  map_size: 11 # Square Grid-Rand-Poly map, including boundary walls
  fill: 0.1 # Upper bound on random interior obstacle density
  lidar_num_beams: 200
  max_steps: 500
  rew_lambda: 0.5 # Mix individual reward (1.0) with mean team reward (0.0)
seed: 1
total_steps: 20_000_000 # Environment transitions; each contains num_agents observations
num_envs: 64
num_steps: 128
num_minibatches: 4 # Divides num_envs * num_agents; keep recurrent sequences intact
update_epochs: 4
model:
  hidden_size: 128
  recurrent:
    hidden_size: 128
    num_layers: 1
    intermediate_size: 0
bf16: false
learning_rate: 0.0003
anneal_lr: true
lr_decay: linear
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
target_kl: null
entropy_coef: 0.01
entropy_decay: constant
value_coef: 1.0
max_grad_norm: 0.5
ckpt_dir: /runs/mappo/${run_id}
run_id: mappo_${path_name:${env_id}}_crowded_${jaxnav.num_agents}agents_${jaxnav.map_size}x${jaxnav.map_size}_seed${seed}
# All intervals count completed PPO iterations (one rollout and its updates).
# Video, checkpoint, and eval: every 20% of training, rounded up; also run on completion.
log_interval: 10
video_interval: 489
video_max_frames: 501
video_fps: 24
checkpoint_interval: 489
eval_interval: 489
eval_episodes: 10
eval_seed: 10000

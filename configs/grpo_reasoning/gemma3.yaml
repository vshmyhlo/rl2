# uv run python -m rl2.train_grpo_reasoning --config configs/grpo_reasoning/gemma3.yaml
checkpoint: gs://gemma-data/checkpoints/gemma3-270m-it # Instruction-tuned; or a local native Gemma/Orbax checkpoint
tokenizer: null # Official Gemma 3 tokenizer; or a local/gs:// SentencePiece .model file
dtype: bfloat16
attention_backend: cudnn # Requires bfloat16 and Hopper (H100) or newer for Gemma's 256-wide heads.

task: basic_arithmetic
task_config:
  min_terms: 2
  max_terms: 2
  min_digits: 2
  max_digits: 2
  operators: ["*"]
  allow_parentheses: false
  allow_negation: false
  format_style: simple
seed: 1
total_updates: 1000
# Gemma's 262144-token vocabulary makes logits memory intensive; start small.
num_tasks: 1
group_size: 4
num_minibatches: 4
update_epochs: 1
max_prompt_tokens: 128
# Total transcript budget: model tokens plus inserted calculator results.
max_new_tokens: 128
calculator_max_calls: 2 # Set to 0 to disable calculator access.
temperature: 1.0
learning_rate: 1.0e-6
clip_coef: 0.2
beta: 0.0
duration_penalty_coef: 0.0 # Learn correctness/tool use before rewarding shorter answers.
max_grad_norm: 1.0
ckpt_dir: runs/grpo_reasoning/${run_id}
run_id: gemma3_270m_calculator_multiplication_zero_shot
log_interval: 10
log_completion_count: 4
checkpoint_interval_seconds: 600

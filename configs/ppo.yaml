env:
  id: Breakout-MinAtar # Gymnax; 10x10 binary planes, three actions
seed: 1
total_steps: 10000000 # Agent transitions across all environments; only full rollouts run
num_envs: 32
num_steps: 128 # Per env: 4096 transitions per rollout with 32 envs
num_minibatches: 4 # Must divide num_envs; 8 whole sequences / 1024 transitions per minibatch
update_epochs: 4
model:
  encoder:
    type: rgb # Default convolution stages and 768-wide embedding
  recurrent: # LSTM backbone settings
    type: lstm
    hidden_size: 1536
bf16: true # Mixed precision compute; parameters, recurrent memory, and losses stay float32
learning_rate: 0.00025
anneal_lr: true # false keeps a constant learning rate
lr_decay: linear # Decay over the rollout budget when anneal_lr is true
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.1
target_kl: 0.01 # null disables KL early stopping
entropy_coef: 0.01
entropy_decay: constant # Keep the exploration bonus throughout training
value_coef: 0.5
max_grad_norm: 0.5
ckpt_dir: gs://cohere-dev/vlad/rl2/${run_id}
run_id: ppo # TensorBoard run directory; change this for a new run
# All intervals count completed PPO iterations (one rollout and its updates).
# Video every 10% and eval every 20% of training, rounded up to iterations; also run on completion.
video_interval: 245 # Iterations between recordings; 0 disables recording
video_max_frames: 900 # Maximum recorded frames, including the initial observation
video_fps: 40.0 # Video playback frames per second
eval_interval: 489 # Iterations between evaluations on fixed Gymnax seeds
eval_episodes: 100 # Full games per evaluation
eval_seed: 10000 # Fixed evaluation seed set, separate from training RNG

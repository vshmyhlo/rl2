env_id: ALE/Breakout-v5
observation_size: null # Resize only; null preserves the original resolution
frame_stack: true # true stacks 4 frames; false uses a single frame
atari_preprocessing: true # true enables 84x84 grayscale, action repeat 4, max pooling, and random reset no-ops
seed: 1
total_steps: 10000000 # Agent transitions across all envs; rounded down to full rollouts
num_envs: 32
vector_env: async # async (subprocesses) or sync
num_steps: 128
num_minibatches: 4 # Must divide num_envs; minibatches contain whole sequences
update_epochs: 4
model:
  type: gdn2
  backend: triton # NVIDIA GPU; install with uv sync --extra cuda12 --extra gdn2-triton; use jax for CPU
  hidden_size: 256
  num_layers: 2
  num_heads: 4
  head_dim: 64
  intermediate_size: 512
  conv_size: 4
bf16: true # Mixed precision compute; parameters, recurrent memory, and losses stay float32
learning_rate: 0.00025
anneal_lr: true # false keeps a constant learning rate
lr_decay: cosine # Decay to zero over the rollout budget
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.1
target_kl: 0.01 # null disables KL early stopping
entropy_coef: 0.01
entropy_decay: cosine # Decay to zero over the rollout budget
value_coef: 0.5
max_grad_norm: 0.5
log_dir: gs://cohere-dev/vlad/rl2/ppo/${run_id}/${path_name:${env_id}} # Full run path; env_id replaces / with _
run_id: ppo_atari_gdn2 # TensorBoard run directory; change this for a new run
video_every_episodes: 100 # 0 disables recording
video_speed: 4.0 # Playback multiplier: 1.0 normal, 2.0 double speed
eval_every_minutes: 30 # Wall-clock minutes between evaluations; timer restarts after evaluation; 0 disables
eval_episodes: 100 # Full games per evaluation, after the rollout update; training pauses during evaluation
eval_seed: 10000 # Fixed evaluation seed set, separate from training RNG

# Pgx 2048 CNN + LSTM baseline for two GPUs.
# Native Pgx rules: illegal moves end the episode with reward -1; merges earn tile values.
env:
  id: Pgx
  game: "2048"
  max_steps: 10_000
seed: 1
total_steps: 10_000_000 # Environment steps summed across environments; only full rollouts run
num_envs: 64 # 32 environments per GPU
num_steps: 128 # 8192 environment steps per rollout
num_minibatches: 8 # 8 whole sequences per minibatch; 512 environment steps per GPU
update_epochs: 4
model:
  encoder:
    type: conv2d # Native 4x4x31 one-hot tile planes, without spatial downsampling
    stages:
      - { channels: 64, blocks: 2, kernel_size: 3, resize_factor: 1.0 }
    embedding_size: 256
  recurrent:
    type: lstm
    hidden_size: 256
    num_layers: 1
    intermediate_size: 0
bf16: false
learning_rate: 0.0003
anneal_lr: true
lr_decay: linear
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
target_kl: null # Fixed epoch count; no KL early stopping
entropy_coef: 0.01
entropy_decay: constant
value_coef: 1.0 # Weights the half-MSE value loss: 0.5 * mean squared error
max_grad_norm: 0.5
ckpt_dir: /runs/ppo/${run_id}
run_id: ppo_${env.id}_${env.game}_seed${seed}
# Intervals count completed PPO iterations.
# Checkpoints every 10% and eval every 20% of training, rounded up to iterations.
# Evaluation (including GIF recording), checkpoints, and logging also run on completion.
checkpoint_interval: 122
log_interval: 10
video_max_frames: 1001 # Recording cap; evaluation continues until the episode ends
video_fps: 10.0
eval_interval: 244
eval_episodes: 10
eval_seed: 10000

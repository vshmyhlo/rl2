# Run: uv run ppo --config configs/ppo/crazyflow/figure_eight.yaml
# Native attitude controls at 50 Hz; 500 Hz Crazyflow so_rpy physics.
env:
  id: Crazyflow
  task: figure_eight
  freq: 50
  max_steps: 500
seed: 1
total_steps: 10_000_000
num_envs: 64
num_steps: 128
num_minibatches: 8
update_epochs: 4
model:
  continuous_policy: truncated_gaussian
  encoder:
    type: mlp
    hidden_size: 64
    embedding_size: 64
  recurrent:
    type: lstm
    hidden_size: 64
bf16: false
learning_rate: 0.0003
anneal_lr: true
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
target_kl: 0.01
entropy_coef: 0.0
max_grad_norm: 0.5
ckpt_dir: /runs/ppo/${run_id}
run_id: ppo_crazyflow_${env.task}_seed${seed}
checkpoint_interval: 100
log_interval: 10
video_interval: 0
video_max_frames: 501
video_fps: 50.0
eval_interval: 200
eval_episodes: 10

env_id: Craftax
craftax:
  env_id: Craftax-Pixels-v1 # Or Craftax-Classic-Pixels-v1
  max_steps: null # Native episode limit
seed: 1
total_steps: 10_000_000
num_envs: 32
num_steps: 128
num_minibatches: 4
update_epochs: 4
model:
  encoder:
    type: rgb
    stages:
      - { channels: 32, blocks: 1, resize_factor: 0.5 }
      - { channels: 64, blocks: 1, resize_factor: 0.5 }
      - { channels: 128, blocks: 1, resize_factor: 0.5 }
      - { channels: 128, blocks: 1, resize_factor: 0.5 }
  recurrent:
    type: lstm
    hidden_size: 256
bf16: true
learning_rate: 0.00025
anneal_lr: true
lr_decay: linear
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
target_kl: 0.01
entropy_coef: 0.01
entropy_decay: constant
value_coef: 0.5
max_grad_norm: 0.5
log_dir: gs://cohere-dev/vlad/rl2/ppo/${run_id}
run_id: ppo_${path_name:${env_id}}_${path_name:${craftax.env_id}}_seed${seed}
# All intervals count completed PPO iterations (one rollout and its updates).
checkpoint_interval: 200
log_interval: 60
video_interval: 600
video_max_frames: 900
video_fps: 40.0
eval_interval: 200
eval_episodes: 10
eval_seed: 10000

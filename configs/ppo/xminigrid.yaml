# Simple Four Rooms navigation task.
env_id: XLand-MiniGrid
xminigrid:
  env_id: MiniGrid-FourRooms
  benchmark: null
  ruleset_id: null
  max_steps: null # Native limit; also controls the upstream success reward
seed: 1
total_steps: 10_000_000
num_envs: 32
num_steps: 128
num_minibatches: 4
update_epochs: 4
model:
  encoder:
    type: xminigrid # Native tile/color IDs; no pixel rendering during rollouts
    token_size: 32
    channels: 64
    blocks: 2
    embedding_size: 256
  recurrent:
    type: lstm
    hidden_size: 256
    num_layers: 4
bf16: true
learning_rate: 0.00025
anneal_lr: true
lr_decay: linear
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
target_kl: 0.01
entropy_coef: 0.01
entropy_decay: constant
value_coef: 0.5
max_grad_norm: 0.5
ckpt_dir: /runs/ppo/${run_id}
run_id: ppo_${path_name:${env_id}}_${path_name:${xminigrid.env_id}}_seed${seed}
# All intervals count completed PPO iterations (one rollout and its updates).
log_interval: 10
video_interval: 100
video_max_frames: 900
video_fps: 10.0
checkpoint_interval: 200
eval_interval: 200
eval_episodes: 10
eval_seed: 10000

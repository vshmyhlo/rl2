# Simple symbolic CNN + LSTM baseline; four reward cycles per episode.
env:
  id: Foragax
  env_id: ForagaxSquareWaveTwoBiome-v11
  observation_type: object # Six one-hot channels distinguish mushroom types across biomes
  aperture_size: 9
  period: 1024 # Full reward cycle; native default is 500_000
  reward_delay: 0
  max_steps: 4096 # PPO truncation resets the world and reward clock
seed: 1
total_steps: 10_000_000 # Environment steps summed across environments; only full rollouts run
num_envs: 32
num_steps: 128
num_minibatches: 4
update_epochs: 4
model:
  encoder:
    type: conv2d
    stages:
      - { channels: 32, blocks: 0, kernel_size: 3, resize_factor: 1.0 }
    embedding_size: 64
  recurrent:
    type: lstm
    hidden_size: 64
    num_layers: 1
    intermediate_size: 0
bf16: false
learning_rate: 0.00025
anneal_lr: true
lr_decay: linear
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
target_kl: null # Fixed epoch count; no KL early stopping
entropy_coef: 0.01
entropy_decay: constant
value_coef: 1.0 # Weights the half-MSE value loss: 0.5 * mean squared error
max_grad_norm: 0.5
ckpt_dir: /runs/ppo/${run_id}
run_id: ppo_${path_name:${env.id}}_${path_name:${env.env_id}}_seed${seed}
# All intervals count completed PPO iterations (one rollout and its updates).
# Checkpoints every 5% and eval every 20% of training, rounded up to iterations.
# Evaluation (including GIF recording), checkpoints, and logging also run on completion.
checkpoint_interval: 123
log_interval: 10
video_interval: 0 # Record videos only during evaluation
video_max_frames: 900
video_fps: 15.0
eval_interval: 489
eval_episodes: 10
eval_seed: 10000

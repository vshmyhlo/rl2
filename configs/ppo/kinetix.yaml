# Symbolic physics observations and continuous control of Kinetix's easy bipedal walker.
env:
  id: Kinetix
  action_type: continuous
  size: l # s, m, or l; must accommodate every selected level
  levels: [l/mjc_walker_easy.json] # null samples a new procedural level at each reset
  max_steps: 256 # Agent steps, each advancing frame_skip physics steps
  frame_skip: 2
  downscale: 4 # Evaluation videos only: 500 / 4 = 125 pixels per side
  dense_reward_scale: 0.1 # 0 disables distance-based reward shaping
seed: 1
total_steps: 10_000_000
num_envs: 32
num_steps: 128
num_minibatches: 4
update_epochs: 8
model:
  continuous_policy: truncated_gaussian # beta learns alpha/beta for each bounded action
  encoder:
    type: kinetix
    hidden_size: 256
    embedding_size: 256
  recurrent:
    type: lstm
    hidden_size: 256
bf16: false # Keep symbolic features and continuous-control heads in float32
learning_rate: 0.0003
anneal_lr: true
lr_decay: linear
gamma: 0.995 # Longer credit horizon for reaching the goal
gae_lambda: 0.95
clip_coef: 0.2
target_kl: 0.01
entropy_coef: 0.001 # Modest exploration bonus for the continuous action distribution
entropy_decay: cosine # Let the walker settle into a precise gait late in training
value_coef: 0.5
max_grad_norm: 0.5
ckpt_dir: /runs/ppo/${run_id}
run_id: ppo_${path_name:${env.id}}_${path_name:${env.levels.0}}_${model.continuous_policy}_seed${seed}
# All intervals count completed PPO iterations (one rollout and its updates).
# Video, checkpoint, and eval: every 20% of training, rounded up; also run on completion.
checkpoint_interval: 489
log_interval: 10
video_interval: 489
video_max_frames: 900
video_fps: 30.0 # 60 Hz physics / frame_skip 2
eval_interval: 489
eval_episodes: 10
eval_seed: 10000

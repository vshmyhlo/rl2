# PPO Atari hyperparameters: https://arxiv.org/pdf/1707.06347, Table 5.
env_id: ALE/Enduro-v5
observation_size: null # Resize only; null preserves the original resolution
frame_stack: true # true stacks 4 frames; false uses a single frame
atari_preprocessing: true # true enables 84x84 grayscale, action repeat 4, max pooling, and random reset no-ops
seed: 1
total_steps: 10_000_000 # Agent transitions; 40M emulator frames with action repeat 4
num_envs: 8
vector_env: async # async (subprocesses) or sync
num_steps: 128
num_minibatches: 4 # 8 envs * 128 steps / 4 = 256 samples; preserve whole sequences
update_epochs: 3
encoder_stages: # Together with the LSTM and heads, ~9.12M total parameters
  # Reference Atari CNN channels and kernels; resize factors give 84 -> 21 -> 11 -> 11.
  # Resize + SAME convolution substitutes for VALID strided convolution at 84x84 input.
  # The fixed 7x7 stem, 768-wide projection, normalization/SiLU, and deeper heads remain.
  # blocks=0 omits residual blocks; resize-convolution itself has no activation.
  - { channels: 32, blocks: 0, kernel_size: 8, resize_factor: 0.25 } # 84 -> 21
  - { channels: 64, blocks: 0, kernel_size: 4, resize_factor: 0.5 } # 21 -> 11
  - { channels: 64, blocks: 0, kernel_size: 3, resize_factor: 1.0 } # 11 -> 11
model: # Retain recurrence as requested; this LSTM is an adaptation of the reference CNN policy.
  type: lstm
  hidden_size: 512
  num_layers: 1
  intermediate_size: 0 # Disable the optional recurrent MLP
bf16: true # Mixed precision compute; parameters, recurrent memory, and losses stay float32
learning_rate: 0.00025
anneal_lr: true # false keeps a constant learning rate
lr_decay: linear # Paper's alpha: linearly anneal from 1 to 0
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.1 # Paper uses 0.1 * alpha; this trainer only supports a constant clip coefficient
target_kl: null # Fixed epoch count; no KL early stopping
entropy_coef: 0.01
entropy_decay: constant
value_coef: 2.0 # Paper c1=1 on squared error; trainer multiplies 0.5 * squared error
max_grad_norm: 0.5
log_dir: gs://cohere-dev/vlad/rl2/ppo/${run_id}
run_id: ppo_atari_${path_name:${env_id}} # Include env_id with / replaced by _
video_every_episodes: 100 # 0 disables recording
video_speed: 4.0 # Playback multiplier: 1.0 normal, 2.0 double speed
eval_every_minutes: 30 # Wall-clock minutes between evaluations; timer restarts after evaluation; 0 disables
eval_episodes: 100 # Full games per evaluation, after the rollout update; training pauses during evaluation
eval_seed: 10000 # Fixed evaluation seed set, separate from training RNG

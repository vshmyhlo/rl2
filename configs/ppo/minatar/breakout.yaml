# Enduro PPO hyperparameters adapted to MinAtar: https://arxiv.org/pdf/1707.06347, Table 5.
env_id: Breakout-MinAtar
seed: 1
total_steps: 10_000_000 # Agent transitions across all environments; only full rollouts run
num_envs: 8
num_steps: 128
num_minibatches: 4 # 8 envs * 128 steps / 4 = 256 samples; preserve whole sequences
update_epochs: 3
model:
  encoder:
    type: rgb
    stages:
      # Enduro CNN settings; MinAtar spatial sizes are 10 -> 3 -> 2 -> 2.
      # The fixed 7x7 stem, 768-wide projection, normalization/SiLU, and deeper heads remain.
      # blocks=0 omits residual blocks; resize-convolution itself has no activation.
      - { channels: 32, blocks: 0, kernel_size: 8, resize_factor: 0.25 } # 10 -> 3
      - { channels: 64, blocks: 0, kernel_size: 4, resize_factor: 0.5 } # 3 -> 2
      - { channels: 64, blocks: 0, kernel_size: 3, resize_factor: 1.0 } # 2 -> 2
  recurrent: # Retain recurrence as requested; this LSTM is an adaptation of the reference CNN policy.
    type: lstm
    hidden_size: 512
    num_layers: 1
    intermediate_size: 0 # Disable the optional recurrent MLP
bf16: true # Mixed precision compute; parameters, recurrent memory, and losses stay float32
learning_rate: 0.00025
anneal_lr: true # false keeps a constant learning rate
lr_decay: linear # Paper's alpha: linearly anneal from 1 to 0
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.1 # Paper uses 0.1 * alpha; this trainer only supports a constant clip coefficient
target_kl: null # Fixed epoch count; no KL early stopping
entropy_coef: 0.01
entropy_decay: constant
value_coef: 2.0 # Paper c1=1 on squared error; trainer multiplies 0.5 * squared error
max_grad_norm: 0.5
log_dir: gs://cohere-dev/vlad/rl2/ppo/${run_id}
run_id: ppo_${path_name:${env_id}}_seed${seed}
# All intervals count completed PPO iterations (one rollout and its updates).
checkpoint_interval: 200 # Iterations between checkpoints; also save on completion
log_interval: 60 # Iterations between progress logs; also log on completion
video_interval: 60 # Iterations between recordings; 0 disables recording
video_fps: 40.0 # Video playback frames per second
eval_interval: 200 # Iterations between evaluations; 0 disables
eval_episodes: 10 # Full games per evaluation, after the rollout update; training pauses during evaluation
eval_seed: 10000 # Fixed evaluation seed set, separate from training RNG

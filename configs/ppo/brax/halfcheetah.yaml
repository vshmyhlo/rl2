# Locomotion: run forward with a planar six-joint robot. Assets ship with Brax.
# Run: uv run ppo --config configs/ppo/brax/halfcheetah.yaml
env:
  id: Brax
  task: halfcheetah
  backend: generalized
  max_steps: 1000 # 50 simulated seconds at 20 Hz
seed: 1
total_steps: 10_000_000 # Environment steps summed across environments
num_envs: 32
num_steps: 128
num_minibatches: 4
update_epochs: 4
model:
  continuous_policy: truncated_gaussian
  encoder:
    type: mlp
    hidden_size: 256
    embedding_size: 256
  recurrent:
    type: lstm
    hidden_size: 256
bf16: false
learning_rate: 0.0003
anneal_lr: true
lr_decay: linear
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
target_kl: 0.01
entropy_coef: 0.001
entropy_decay: cosine
value_coef: 1.0 # Weights the half-MSE value loss: 0.5 * mean squared error
max_grad_norm: 0.5
ckpt_dir: /runs/ppo/${run_id}
run_id: ppo_${path_name:${env.id}}_${env.task}_${env.backend}_seed${seed}
checkpoint_interval: 489
log_interval: 10
# Intervals count completed PPO iterations.
# Video/evaluation require an available OpenGL backend (e.g. MUJOCO_GL=egl).
# Video every 10% and eval every 20% of training, rounded up to iterations; also run on completion.
video_interval: 245
video_max_frames: 1001
video_fps: 20.0
eval_interval: 489
eval_episodes: 10
eval_seed: 10000

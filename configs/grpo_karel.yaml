seed: 1
total_updates: 100000 # Rollout batches; TensorBoard steps count AST expansions, exclude PAD
num_tasks: 32 # Sampled pairs per rollout
group_size: 8 # Independent program samples for each pair
num_minibatches: 4 # Must divide num_tasks * group_size; keep whole programs together
update_epochs: 1
max_nodes: 128 # Maximum AST nodes/expansion actions, including list and value nodes
max_depth: 32 # AST depth, including list nodes; distinct from env.max_depth
decision_batch_size: 32 # Partial-tree rounds per microbatch (all holes predicted together); gradients accumulate per program minibatch
bf16: true # AST Transformer compute in BF16; parameters, optimizer, and loss in FP32
attention_implementation: cudnn # Requires a supported NVIDIA GPU; use xla for CPU
d_model: 320 # 9,234,920 parameters with max_nodes=128 and 8x8 pairs
num_layers: 7
num_heads: 5 # Transformer head dimension = d_model / num_heads = 64
num_kv_heads: null # Full multi-head attention; fewer KV heads enables grouped-query attention
# All current holes expand in parallel from one encoding per round; new children wait for the next round.
# At most min(max_nodes, max_depth + 1) rounds; no causal KV cache.
learning_rate: 0.0001
anneal_lr: true
clip_coef: 0.2
target_kl: 0.02 # Old-policy KL early stopping; null disables
entropy_coef: 0.01
# AST constructor/value masking is always enabled, including node/depth/source budgets.
kl_coef: 0.0 # Optional penalty against the frozen initial model; no reference forward when zero
max_grad_norm: 0.5
log_dir: gs://cohere-dev/vlad/rl2/grpo_karel
run_id: karel_ast_parallel_v1 # Reuse to resume; change for a new run, or null for a timestamped run
checkpoint_interval_seconds: 300 # Save to log_dir/run_id on GCS every 5 minutes (at rollout boundaries), plus final
log_program_interval: 10 # First rollout and every 10th; rotate through task groups
log_program_count: 8 # Compare first 8 samples from the same group; 0 disables
env:
  height: 8
  width: 8
  wall_probability: 0.1
  marker_probability: 0.2
  max_markers: 10
  max_depth: 2
  max_statements: 3
  max_program_tokens: 128 # Printed-source limit (including m)); also enforced by the AST mask
  max_execution_steps: 256
  max_sampling_attempts: 1000
  # reward = syntax + runtime + distance + exact_success + trajectory - length cost - execution cost.
  # progress(s) = clip(1 - 0.5 * D(s,target) / D(initial,target), 0, 1).
  # Exact target: 1; unchanged distance: 0.5; doubled distance or worse: 0.
  # D combines these errors; all weights must be finite and strictly positive.
  position_weight: 1.0 # Shortest-path distance through free cells
  orientation_weight: 1.0 # 1 for any wrong heading, 0 for a match
  marker_weight: 1.0 # Sum of absolute marker-count errors across all cells
  trajectory_weight: 0.0 # 0 disables; finite and nonnegative
  length_penalty_weight: 0.0 # Deduct weight * generated tokens / max_program_tokens (all outcomes)
  execution_penalty_weight: 0.0 # Deduct weight * consumed ticks / max_execution_steps; zero if not executed
  # trajectory = max(0, D_initial - D_last) / (D_initial + sum of positive distance increases).
  # Add trajectory_weight * trajectory after completed or failed executions; zero on syntax/token limits.
  # Syntax errors / missing m): (1/(1+d), 0, 0), d = minimum syntax token edits.
  # Runtime / execution-limit failure: (1, progress(last_valid_state), 0).
  # Normal completion: (1, progress(final_state), progress(final_state)); +1 for exact success, base total 4, plus trajectory bonus.

env_id: ALE/SpaceInvaders-v5
observation_size: null # Resize only; null preserves the original resolution
frame_stack: true # true stacks 4 frames; false uses a single frame
atari_preprocessing: true # true enables 84x84 grayscale, action repeat 4, max pooling, and random reset no-ops
seed: 1
total_steps: 10000000
num_envs: 32
vector_env: async # async (subprocesses) or sync
num_steps: 128
num_minibatches: 4 # Must divide num_envs; minibatches contain whole sequences
update_epochs: 4
lstm_hidden_size: 1536 # About 50.56M parameters with the residual encoder and 84x84 RGB observations
bf16: true # Mixed precision compute; parameters, recurrent memory, and losses stay float32
learning_rate: 0.00025
anneal_lr: true # Linear decay over the training budget; false keeps a constant rate
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.1
target_kl: 0.01 # null disables KL early stopping
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5
log_dir: gs://cohere-dev/vlad/rl2
video_every_episodes: 100 # 0 disables recording
video_speed: 4.0 # Playback multiplier: 1.0 normal, 2.0 double speed
eval_every_minutes: 20 # Wall-clock minutes between evaluations; timer restarts after evaluation; 0 disables
eval_episodes: 100 # Full games per evaluation, after the rollout update; training pauses during evaluation
eval_seed: 10000 # Fixed evaluation seed set, separate from training RNG

env_id: ALE/SpaceInvaders-v5
observation_size: null # Resize only; null preserves the preprocessed or original resolution
frame_stack: false # Mamba maintains history; false uses a single frame
atari_preprocessing: false # 84x84 grayscale, action repeat 4, max pooling, and random reset no-ops
seed: 1
total_steps: 1000000 # Environment transitions across all workers; must divide evenly by num_envs
num_envs: 32
vector_env: async # async (spawned subprocesses) or sync
num_steps: 64 # Shorter sequences limit activation memory; recurrent memory carries across chunks
d_model: 88 # Latent and Mamba model width; ~9.93M total parameters with native 210x160 RGB input
num_layers: 4 # Independent Mamba blocks, each with its own recurrent carry
d_intermediate: null # SwiGLU width: null uses int(8*d_model/3), rounded up to 128; 0 disables the MLP
encoder_channels: [8, 16, 32, 64] # Shared residual convolutional encoder; outputs d_model features
encoder_max_flattened_size: 2048 # Add stages at the final channel width until within this limit; null disables
d_state: 16 # Mamba state width; even and at least 4
headdim: 8 # Must divide 2 * d_model
bf16: true # BF16 compute in all convolution/dense layers; parameters, carry, and losses stay float32
learning_rate: 0.0003
max_grad_norm: 1.0
log_dir: gs://cohere-dev/vlad/rl2/wm # Local path or GCS prefix for TensorBoard logs and config.json
log_every: 10 # Print training metrics every N updates
log_flush_secs: 30 # Background TensorBoard flush interval; also flush after progress reports and videos
checkpoint_dir: gs://cohere-dev/vlad/rl2_cp/wm # Uses the same run name as log_dir; saves checkpoint.msgpack and config.json
checkpoint_every: 10000 # Save every N updates and at the end of training
video_every_steps: 10000 # Collected transitions; record after the rollout crossing each interval; 0 disables
video_num_steps: 5 # Imagined transitions after one real seed frame; fixed horizon, ignoring predicted termination
video_fps: 1 # Playback frames per second; Atari preprocessing repeats each action for 4 emulator frames

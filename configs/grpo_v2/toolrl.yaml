model: Qwen/Qwen3-0.6B
attention_backend: tokamax
scan_layers: true
gradient_checkpointing: true
padding_multiple: 256
taskset:
  id: toolrl
  # Official train split, pinned to an upstream revision. A local Parquet path also works.
  dataset_file: https://raw.githubusercontent.com/qiancheng0/ToolRL/8cee13ec0ca72f0461da372a93a6fd8140dbb840/dataset/rlla_4k/train.parquet
seed: 8
batch_size: 32 # Total rollouts per optimizer update.
group_size: 8
total_iterations: null
max_tokens: 1024
max_turns: 1
temperature: 1.0
learning_rate: 0.000001
loss:
  kind: grpo
  clip_coef: 0.2
max_grad_norm: 1.0
weight_update_pause_mode: wait # wait or keep in-flight vLLM requests
run_id: grpo_v2_toolrl_${path_name:${model}}_seed${seed}
ckpt_dir: /runs/grpo_v2/${run_id} # Profiling artifacts; checkpointing is not implemented.

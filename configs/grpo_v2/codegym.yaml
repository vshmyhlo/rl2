model: Qwen/Qwen3-0.6B
taskset:
  id: codegym
  # Set this to the CodeGym manager host; vLLM uses port 8000 on the trainer host.
  manager_url: http://codegym:8000
  # Full English-task/English-environment train split (80,130 rows across all four shards).
  dataset_file: hf://datasets/VanishD/CodeGym@85286359a342f7a288aea74273772b69b9b784c2/task_en_instruction_en_env/train-*.parquet
seed: 3
num_groups: 4
group_size: 8
total_iterations: null
max_tokens: 512
max_turns: 32
temperature: 1.0
learning_rate: 0.000001
clip_coef: 0.2
max_grad_norm: 1.0
update_epochs: 1
minibatches_per_epoch: 4
grad_accum_steps: 1
weight_update_pause_mode: wait # wait, abort, or keep in-flight vLLM requests
run_id: grpo_v2_codegym_${path_name:${model}}_seed${seed}
ckpt_dir: /runs/grpo_v2/${run_id} # Reserved; checkpointing is not implemented yet

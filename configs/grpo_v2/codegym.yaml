model: Qwen/Qwen3-0.6B
learning_rate: 1e-6
adamw_batch_size_scale: 1.0
loss:
  kind: grpo
  clip_coef: 0.2
  rollout_is_threshold: 2.0 # Decoupled token-level importance sampling; no rejection sampling.
max_grad_norm: 1.0
finetuning:
  mode: full # Optimizes every weight and requires more GPU memory.
# learning_rate: 1e-5
# finetuning:
#   mode: lora
#   rank: 16
#   alpha: 32
attention_backend: tokamax
scan_layers: true
gradient_checkpointing: true
padding_multiple: 1024
tasksets:
  codegym:
    weight: 1.0
    taskset:
      id: codegym
      manager_url: http://codegym.codegym.svc.cluster.local:8000
      # Full English-task/English-environment train split (80,130 rows across all four shards).
      dataset_file: hf://datasets/VanishD/CodeGym@85286359a342f7a288aea74273772b69b9b784c2/task_en_instruction_en_env/train-*.parquet
seed: 1

batch_size: 32 # Total rollouts per optimizer update.
group_size: 8 # verl rollout.n; 32 rollouts per batch.

prefetch_batches: 4 # Requires capacity for up to 160 concurrent CodeGym episodes.
grad_accum_steps: 1 # Equal microbatches averaged per optimizer update.
parameter_sync_steps: 4 # Publish every fourth optimizer update.

# verl's off-policy threshold/drop strategy and minibatch streaming are unsupported.
weight_update_pause_mode: wait
drop_degenerate_groups: false
length_penalty:
  reference_tokens: 8192 # Generated-token scale, independent of the transcript budget.
  penalty: 0.05 # Up to a 5% reward reduction, including partial credit.
max_tokens: 8192 # Total transcript tokens, including system, prompt, and tools.
max_turns: 50
rollout_timeout: 1200
environment_timeout: 600
run_id: grpo_v2_codegym_${path_name:${model}}_${finetuning.mode}_${attention_backend}_s${seed}_lr${learning_rate}_adamw_scale${adamw_batch_size_scale}_bs${batch_size}_gs${group_size}_ddg${drop_degenerate_groups}_pf${prefetch_batches}_next_ready_ps${parameter_sync_steps}_success_lp${length_penalty.reference_tokens}_${length_penalty.penalty}
ckpt_dir: /runs/grpo_v2/${run_id} # Checkpoints and profiling artifacts.
checkpoint_interval: 50
example_log_interval: 50

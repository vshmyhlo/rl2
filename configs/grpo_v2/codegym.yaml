model: Qwen/Qwen3-0.6B
learning_rate: 1e-6
adamw_batch_size_scale: 1.0
clip_coef: 0.2
max_grad_norm: 1.0
rollout_is_threshold: 2.0 # Decoupled token-level importance sampling; no rejection sampling.
finetuning_mode: full # lora or full; full optimizes every weight and requires more GPU memory.
# learning_rate: 1e-5
# finetuning_mode: lora # lora or full; full optimizes every weight and requires more GPU memory.
lora_rank: 16
lora_alpha: 32
attention_backend: tokamax
scan_layers: true
gradient_checkpointing: true
padding_multiple: 1024
tasksets:
  codegym:
    weight: 1.0
    taskset:
      id: codegym
      manager_url: http://codegym.codegym.svc.cluster.local:8000
      # Full English-task/English-environment train split (80,130 rows across all four shards).
      dataset_file: hf://datasets/VanishD/CodeGym@85286359a342f7a288aea74273772b69b9b784c2/task_en_instruction_en_env/train-*.parquet
seed: 1

num_groups: 4 # verl data.train_batch_size (task groups).
group_size: 8 # verl rollout.n; 32 rollouts per batch.
grad_accum_steps: 32 # One rollout per microbatch.

update_epochs: 1
minibatches_per_epoch: 1 # One optimizer update per epoch, using all 32 rollouts.

prefetch_batches: 4 # Requires capacity for up to 160 concurrent CodeGym episodes.
prefetch_mode: next_ready
parameter_sync_step: 4 # Publish every fourth training batch if weights have changed.

# verl's off-policy threshold/drop strategy and minibatch streaming are unsupported.
weight_update_pause_mode: wait
drop_degenerate_groups: false
length_penalty:
  reference_tokens: 8192 # Generated-token scale, independent of the transcript budget.
  penalty: 0.05 # Up to a 5% reward reduction, including partial credit.
max_tokens: 8192 # Total transcript tokens, including system, prompt, and tools.
max_turns: 50
rollout_timeout: 1200
environment_timeout: 600
run_id: grpo_v2_codegym_${path_name:${model}}_${finetuning_mode}_${attention_backend}_s${seed}_lr${learning_rate}_adamw_scale${adamw_batch_size_scale}_ng${num_groups}_gs${group_size}_mb${minibatches_per_epoch}_ddg${drop_degenerate_groups}_pf${prefetch_batches}_${prefetch_mode}_ps${parameter_sync_step}_success_lp${length_penalty.reference_tokens}_${length_penalty.penalty}
ckpt_dir: /runs/grpo_v2/${run_id} # Checkpoints and profiling artifacts.
checkpoint_interval: 50
example_log_interval: 50

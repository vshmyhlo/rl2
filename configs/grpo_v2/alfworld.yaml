model: Qwen/Qwen3-0.6B
taskset:
  id: alfworld
  config_file: data/alfworld/base_config.yaml
seed: 4
num_groups: 4
group_size: 8
max_tokens: 4096 # Total transcript tokens, including system, prompt, and tools.
max_turns: 50
rollout_timeout: 1200
environment_timeout: 600
run_id: grpo_v2_alfworld_${path_name:${model}}_seed${seed}
ckpt_dir: /runs/grpo_v2/${run_id} # Checkpoints and profiling artifacts.
checkpoint_interval: 10

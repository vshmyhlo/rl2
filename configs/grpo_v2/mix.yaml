model: Qwen/Qwen3-0.6B
learning_rate: 1e-6
adamw_batch_size_scale: 1.0
clip_coef: 0.2
max_grad_norm: 1.0
rollout_is_threshold: 2.0 # Decoupled token-level importance sampling; no rejection sampling.
finetuning_mode: full # lora or full; full optimizes every weight and requires more GPU memory.
# learning_rate: 1e-5
# finetuning_mode: lora # lora or full; full optimizes every weight and requires more GPU memory.
lora_rank: 16
lora_alpha: 32
attention_backend: tokamax
scan_layers: true
gradient_checkpointing: true
padding_multiple: 1024
tasksets:
  alfworld:
    weight: 1.0
    taskset:
      id: alfworld
      config_file: data/alfworld/base_config.yaml
  basic_arithmetic:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: basic_arithmetic
      task_config:
        min_terms: 2
        max_terms: 3
        min_digits: 1
        max_digits: 1
        operators: ["+", "-"]
        allow_parentheses: false
        allow_negation: false
  leg_counting:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: leg_counting
      task_config:
        min_animals: 1
        max_animals: 3
        min_instances: 1
        max_instances: 3
  letter_counting:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: letter_counting
      task_config:
        min_words: 1
        max_words: 3
  number_sorting:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: number_sorting
      task_config:
        min_numbers: 3
        max_numbers: 5
        min_decimals: 0
        max_decimals: 0
        min_value: 0
        max_value: 20
  gcd:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: gcd
      task_config:
        min_numbers: 2
        max_numbers: 2
        min_value: 2
        max_value: 30
  lcm:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: lcm
      task_config:
        min_numbers: 2
        max_numbers: 2
        min_value: 2
        max_value: 12
  count_primes:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: count_primes
      task_config:
        min_n: 1
        max_n: 30
  number_filtering:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: number_filtering
      task_config:
        min_numbers: 3
        max_numbers: 5
        min_decimals: 0
        max_decimals: 0
        min_value: 0
        max_value: 20
  word_sorting:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: word_sorting
      task_config:
        min_words: 3
        max_words: 5
        min_word_length: 3
        max_word_length: 6
  caesar_cipher:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: caesar_cipher
      task_config:
        min_words: 3
        max_words: 5
        min_rotation: 1
        max_rotation: 3
seed: 1

num_groups: 4 # verl data.train_batch_size (task groups).
group_size: 8 # verl rollout.n; 128 rollouts per batch.
grad_accum_steps: 32 # 2 per update

update_epochs: 1
minibatches_per_epoch: 1 # One optimizer update per epoch, using all 128 rollouts.

prefetch_batches: 4 # Overlap collection and training; not verl's warmup/staleness controls.
prefetch_mode: next_ready
parameter_sync_step: 4 # Publish every fourth training batch if weights have changed.

# verl's off-policy threshold/drop strategy and minibatch streaming are unsupported.
weight_update_pause_mode: wait
drop_degenerate_groups: false
length_penalty:
  reference_tokens: 8192 # Generated-token scale, independent of the transcript budget.
  penalty: 0.0 # Disabled because Reasoning Gym tasks can award partial credit.
max_tokens: 8192 # Total transcript tokens, including system, prompt, and tools.
max_turns: 50
rollout_timeout: 1200
environment_timeout: 600
run_id: grpo_v2_mix_${path_name:${model}}_${finetuning_mode}_${attention_backend}_s${seed}_lr${learning_rate}_adamw_scale${adamw_batch_size_scale}_ng${num_groups}_gs${group_size}_mb${minibatches_per_epoch}_ddg${drop_degenerate_groups}_pf${prefetch_batches}_${prefetch_mode}_ps${parameter_sync_step}_success_lp${length_penalty.reference_tokens}_${length_penalty.penalty}
ckpt_dir: /runs/grpo_v2/${run_id} # Checkpoints and profiling artifacts.
checkpoint_interval: 50
example_log_interval: 50

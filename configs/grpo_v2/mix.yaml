model: Qwen/Qwen3-0.6B
vllm:
  max_model_len: 8192
  max_num_seqs: 256
  max_num_batched_tokens: 2048
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  enable_chunked_prefill: true
  async_scheduling: true
learning_rate: 1e-6
adamw_batch_size_scale: 1.0
clip_coef: 0.2
max_grad_norm: 1.0
rollout_is_threshold: 2.0 # Decoupled token-level importance sampling; no rejection sampling.
finetuning:
  mode: full # Optimizes every weight and requires more GPU memory.
attention_backend: tokamax
scan_layers: true
gradient_checkpointing: true
padding_multiple: 1024
# Moderate computation tasks for calculator/Python; bounded inputs fit the transcript budget.
tasksets:
  codegym:
    weight: 1.0
    taskset:
      id: codegym
      manager_url: http://codegym.codegym.svc.cluster.local:8000
      # Full English-task/English-environment train split (80,130 rows across all four shards).
      dataset_file: hf://datasets/VanishD/CodeGym@85286359a342f7a288aea74273772b69b9b784c2/task_en_instruction_en_env/train-*.parquet
  alfworld:
    weight: 1.0
    taskset:
      id: alfworld
      config_file: data/alfworld/base_config.yaml
  basic_arithmetic:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: basic_arithmetic
      task_config:
        min_terms: 4
        max_terms: 8
        min_digits: 2
        max_digits: 4
        operators: ["+", "-", "*", "/"]
        allow_parentheses: true
        allow_negation: true
  leg_counting:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: leg_counting
      task_config:
        min_animals: 4
        max_animals: 8
        min_instances: 5
        max_instances: 50
  letter_counting:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: letter_counting
      task_config:
        min_words: 12
        max_words: 30
  number_sorting:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: number_sorting
      task_config:
        min_numbers: 12
        max_numbers: 24
        min_decimals: 0
        max_decimals: 3
        min_value: -1000
        max_value: 1000
  gcd:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: gcd
      task_config:
        min_numbers: 2
        max_numbers: 3
        min_value: 100
        max_value: 100000
  lcm:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: lcm
      task_config:
        min_numbers: 2
        max_numbers: 4
        min_value: 10
        max_value: 500
  count_primes:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: count_primes
      task_config:
        min_n: 100
        max_n: 10000
  number_filtering:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: number_filtering
      task_config:
        min_numbers: 12
        max_numbers: 24
        min_decimals: 0
        max_decimals: 3
        min_value: -1000
        max_value: 1000
  word_sorting:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: word_sorting
      task_config:
        min_words: 12
        max_words: 24
        min_word_length: 3
        max_word_length: 12
  caesar_cipher:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: caesar_cipher
      task_config:
        min_words: 10
        max_words: 25
        min_rotation: 1
        max_rotation: 25
  rotate_matrix:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: rotate_matrix
      task_config:
        min_n: 4
        max_n: 8
        min_rotations: 1
        max_rotations: 3
  base_conversion:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: base_conversion
      task_config:
        min_base: 2
        max_base: 16
        min_value: 1000
        max_value: 1000000
  shortest_path:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: shortest_path
      task_config:
        min_rows: 6
        max_rows: 10
        min_cols: 6
        max_cols: 10
        p_blocked: 0.2
  group_anagrams:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: group_anagrams
      task_config:
        min_anagram_groups: 4
        max_anagram_groups: 8
        min_words_per_group: 2
        max_words_per_group: 4
  fraction_simplification:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: fraction_simplification
      task_config:
        min_value: 10
        max_value: 1000
        min_factor: 2
        max_factor: 10
        styles: ["plain"]
  largest_island:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: largest_island
      task_config:
        min_rows: 6
        max_rows: 10
        min_cols: 6
        max_cols: 10
        min_num_islands: 2
        max_num_islands: 5
        min_island_size: 3
        max_island_size: 12
  dice:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: dice
      task_config:
        num_dice: 4
        max_dice_size: 12
  bitwise_arithmetic:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: bitwise_arithmetic
      task_config:
        difficulty: 2
  puzzle24:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: puzzle24
      task_config:
        min_value: 1
        max_value: 10
        operators: ["+", "-", "*", "/"]
  mini_sudoku:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: mini_sudoku
      task_config:
        min_empty: 8
        max_empty: 10
  knights_knaves:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: knights_knaves
      task_config:
        n_people: 3
        depth_constraint: 2
        width_constraint: 2
  course_schedule:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: course_schedule
      task_config:
        min_num_courses: 8
        max_num_courses: 15
        min_num_prerequisites: 1
        max_num_prerequisites: 2
        min_cycle_length: 3
        max_cycle_length: 5
        p_solvable: 0.5
  game_of_life:
    weight: 1.0
    taskset:
      id: reasoning_gym
      task: game_of_life
      task_config:
        grid_size_x: 6
        grid_size_y: 6
        simulation_steps: 3
        filled_cells: 15
seed: 1
total_iterations: 1000

num_groups: 4 # verl data.train_batch_size (task groups).
group_size: 8 # verl rollout.n; 32 rollouts per batch.
grad_accum_steps: 16 # One rollout per microbatch.

update_epochs: 1
minibatches_per_epoch: 1 # One optimizer update per epoch, using all 32 rollouts.

prefetch_batches: 1 # Overlap collection and training; not verl's warmup/staleness controls.
parameter_sync_step: 1 # Publish every fourth training batch if weights have changed.
max_staleness: 1 # Mask tokens older than eight weight publications.

# verl's off-policy threshold/drop strategy and minibatch streaming are unsupported.
weight_update_pause_mode: keep
drop_degenerate_groups: false
length_penalty:
  reference_tokens: 8192 # Generated-token scale, independent of the transcript budget.
  penalty: 0.05 # Up to a 5% reward reduction, including partial credit.
max_tokens: 8192 # Total transcript tokens, including system, prompt, and tools.
max_turns: 50
rollout_timeout: 1200
environment_timeout: 600
run_id: grpo_v2_mix_${path_name:${model}}_${finetuning.mode}_${attention_backend}_s${seed}_lr${learning_rate}_adamw_scale${adamw_batch_size_scale}_ng${num_groups}_gs${group_size}_mb${minibatches_per_epoch}_ddg${drop_degenerate_groups}_pf${prefetch_batches}_next_ready_ps${parameter_sync_step}_ms${max_staleness}_success_lp${length_penalty.reference_tokens}_${length_penalty.penalty}
ckpt_dir: /runs/grpo_v2/${run_id} # Checkpoints and profiling artifacts.
checkpoint_interval: 50
example_log_interval: 50

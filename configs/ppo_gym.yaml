env:
  id: Gymnasium
  env_id: CartPole-v1
seed: 1
total_steps: 100000
num_envs: 8
num_steps: 32
num_minibatches: 2
update_epochs: 4
model:
  encoder:
    type: mlp
    hidden_size: 64
    embedding_size: 64
  recurrent:
    hidden_size: 64
bf16: false
learning_rate: 0.0003
anneal_lr: true
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
target_kl: 0.02
entropy_coef: 0.01
max_grad_norm: 0.5
video_fps: 30.0
video_interval: 0
eval_interval: 100
eval_episodes: 10
eval_video: false
run_id: ppo_gym_cartpole_seed${seed}

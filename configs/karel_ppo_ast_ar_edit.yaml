seed: 1
total_updates: 100000
num_tasks: 32
group_size: 8 # Optional repeated episodes per task; PPO also supports 1
env_workers: 8 # Persistent spawned workers for batched reset/stepping; 0 runs locally
num_minibatches: 4 # Must divide num_tasks * group_size; episodes stay together
update_epochs: 1
max_seq_len: 512 # Total seed tokens, one initial report, and action/result tokens per episode
seed_program: "DEF run m( turnLeft m)"
max_nodes: 128 # Whole candidate tree, including lists and values
max_depth: 16 # AST edges, including lists
bf16: true
attention_implementation: cudnn # Use xla for CPU
d_model: 512
num_layers: 8
num_heads: 8
num_kv_heads: null
learning_rate: 0.0001
anneal_lr: true
clip_coef: 0.2 # Per decoder decision, including location selection and STOP
gamma: 0.99 # Discount per editing decision
gae_lambda: 0.95
value_coef: 0.5 # Unclipped half squared-error critic loss
target_kl: 0.02
entropy_coef: 0.01
max_grad_norm: 1.0
log_dir: runs/karel_ppo_ast_ar_edit # Local or gs:// path
run_id: null # Creates a new run; reuse a PPO run ID to resume
checkpoint_interval_seconds: 300
log_interval: 10
log_program_interval: 10
log_program_count: 4
log_compiles: true
# Causal Transformer with KV caching: seed tokens -> initial report -> action/result -> action/result -> ...
# Each edit chooses a location, then expands ONE DFS hole per action token.
# Each action token carries its resulting image and feedback; complete edits execute immediately.
# Every token, including prefill, receives initial/target/current grids through 1x1 Conv + GELU and projection.
# Current image starts at the seed execution result and changes only on completed edit re-evaluations.
# max_seq_len is both the episode token budget and KV-cache capacity.
# Replay uses full causal histories; seed, initial-report and padding predictions have no policy loss.
# Replacement size varies; masks reserve nodes/source tokens AND sequence tokens to complete every hole; feedback uses no extra token.
# Execute only complete candidates, always from the original input grid.
# Feedback: last final/partial grid, score, success/error, ticks, size, score delta, sequence tokens left.
# Edit rewards are score differences; PPO uses a shared-backbone critic and per-decision GAE.
# Advantages normalize over valid decisions per minibatch; policy and value losses exclude seed/PAD.
# STOP and the sequence budget are terminal: zero bootstrap and no extra terminal reward.
# Regressive edits are accepted; success does not force early stopping.
env:
  height: 8
  width: 8
  wall_probability: 0.1
  marker_probability: 0.2
  max_markers: 10
  max_depth: 2
  max_statements: 3
  max_program_tokens: 128
  max_execution_steps: 256
  max_sampling_attempts: 10000
  task_easy_weight: 0.20
  task_navigation_weight: 0.30
  task_marker_weight: 0.25
  task_combined_weight: 0.25
  navigation_min_distance: 3
  marker_min_edits: 3
  combined_min_distance: 2
  combined_min_edits: 2
  syntax_weight: 0.0
  runtime_weight: 0.0
  distance_weight: 1.0
  success_weight: 1.0
  position_weight: 1.0
  orientation_weight: 1.0
  marker_weight: 1.0
  trajectory_weight: 0.0
  length_penalty_weight: 0.05
  execution_penalty_weight: 0.05
